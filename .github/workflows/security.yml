name: Security regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m compileall -q aegis scripts aegis_cli.py
      - run: python -m scripts.release_security sbom sbom.json
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-security.lock
      - run: python -m pip_audit -r requirements-dev.lock --require-hashes --no-deps --disable-pip
      - run: python -m bandit -r aegis -ll -iii
  kernel-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: sudo "$(which python)" -m pytest tests/test_custody_linux.py -q -p no:cacheprovider
