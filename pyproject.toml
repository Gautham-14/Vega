[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-runtime"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "psutil>=5.9.0",
    "cryptography>=43.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
media = ["Pillow>=11.3.0"]
tokenizer = ["tokenizers>=0.21.0"]
embeddings = ["sentence-transformers>=3.4.0"]
cli = ["prompt_toolkit"]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
