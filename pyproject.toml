[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-runtime"
dynamic = ["version"]
description = "Local AI runtime with authenticated workflows, approvals and audit receipts"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "psutil>=5.9.0",
    "cryptography>=43.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
media = ["Pillow>=11.3.0"]
tokenizer = ["tokenizers>=0.21.0"]
embeddings = ["sentence-transformers>=3.4.0"]
cli = ["prompt_toolkit>=3.0.53,<4"]

[project.scripts]
aegis = "aegis.cli:main"
aegis-server = "aegis.server_entry:main"
aegis-vm = "aegis.vm.host:main"

[tool.setuptools.dynamic]
version = {attr = "aegis.version.__version__"}

[tool.setuptools.package-dir]
aegis = "aegis"

[tool.setuptools.package-data]
aegis = ["assets/skills/*.json"]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".audit-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Root compatibility launchers must establish sys.path before package imports.
"scripts/run_cli.py" = ["E402"]
"scripts/run_vm.py" = ["E402"]
"scripts/start_offline.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["aegis/storage/migrations.py", "aegis/security/deployment.py"]
strict = true
follow_imports = "skip"

[tool.coverage.run]
source = ["aegis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
